        // Helper function to get current rotation angle from computed transform matrix
        function getCurrentRotation(element) {
            const style = window.getComputedStyle(element);
            const transform = style.getPropertyValue('transform');
            if (transform === 'none') return 0;
            
            // Parse the matrix values
            const values = transform.split('(')[1].split(')')[0].split(',');
            const a = parseFloat(values[0]);
            const b = parseFloat(values[1]);
            
            // Calculate angle in degrees
            const angle = Math.atan2(b, a) * (180 / Math.PI);
            return angle;
        }

        function playBonusSound() {
            // Initialize AudioContext on first play
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            const ctx = audioContext;
            
            // Main tone
            const mainOsc = ctx.createOscillator();
            mainOsc.type = 'sine';
            mainOsc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
            
            // Harmony
            const harmonyOsc = ctx.createOscillator();
            harmonyOsc.type = 'sine';
            harmonyOsc.frequency.setValueAtTime(880, ctx.currentTime); // A5

            // Natural decay envelope
            const mainGain = ctx.createGain();
            mainGain.gain.setValueAtTime(0, ctx.currentTime);
            mainGain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + 0.02);
            mainGain.gain.exponentialRampToValueAtTime(0.004, ctx.currentTime + 0.24);
            mainGain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.25);
            
            const harmonyGain = ctx.createGain();
            harmonyGain.gain.setValueAtTime(0, ctx.currentTime);
            harmonyGain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.02);
            harmonyGain.gain.exponentialRampToValueAtTime(0.002, ctx.currentTime + 0.19);
            harmonyGain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.2);
            
            // Add brightness
            const filter = ctx.createBiquadFilter();
            filter.type = 'highshelf';
            filter.frequency.setValueAtTime(1000, ctx.currentTime);
            filter.gain.setValueAtTime(6, ctx.currentTime);
            
            // Connect everything
            mainOsc.connect(mainGain);
            harmonyOsc.connect(harmonyGain);
            mainGain.connect(filter);
            harmonyGain.connect(filter);
            filter.connect(ctx.destination);
            
        // Play sound
            mainOsc.start(ctx.currentTime);
            harmonyOsc.start(ctx.currentTime);
            
            mainOsc.stop(ctx.currentTime + 0.4);
            harmonyOsc.stop(ctx.currentTime + 0.4);
        }
        
	   function playGameOverSound() {
            console.log("Function called!"); // Debug log
            
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            const ctx = audioContext;
            console.log("Audio context created:", ctx); // Debug log
            
            // Create oscillators for three descending notes
            const notes = [
                { freq: 220, start: 0 },    // A4
                { freq: 196, start: 0.25 }, // G4
                { freq: 174.615, start: 0.5 } // F4
            ];
            
            notes.forEach(note => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(note.freq, ctx.currentTime + note.start);
                
                gain.gain.setValueAtTime(0, ctx.currentTime + note.start);
                gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + note.start + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + note.start + 0.4);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start(ctx.currentTime + note.start);
                osc.stop(ctx.currentTime + note.start + 0.5);
            });
        }
        
function fadeOut(audio, duration) {
    if (!audio) return;

    // Cancel any existing fade on this audio element
    if (audio._fadeInterval) {
        clearInterval(audio._fadeInterval);
        audio._fadeInterval = null;
    }

    const steps = 30; // smoother fade
    const stepTime = duration / steps;
    const startVolume = audio.volume;
    const volumeStep = startVolume / steps;

    audio._fadeInterval = setInterval(() => {
        if (audio.paused || audio.ended) {
            clearInterval(audio._fadeInterval);
            audio._fadeInterval = null;
            return;
        }

        const newVolume = audio.volume - volumeStep;
        if (newVolume > 0.001) {
            audio.volume = newVolume;
        } else {
            audio.volume = 0;
            audio.pause();
            clearInterval(audio._fadeInterval);
            audio._fadeInterval = null;
        }
    }, stepTime);
}
        
        

        // Helper function to check if two patterns are the same up to rotation
        function arePatternsEquivalent(pattern1, pattern2) {
            for (let rotation = 0; rotation < 5; rotation++) {
                if (pattern1.every((color, i) => color === pattern2[(i + rotation) % 5])) {
                    return true;
                }
            }
            return false;
        }

        // Generate all possible combinations of 5 dots with 3 colors
        function generateDeck() {
            deck = [];
            
            for (let i = 0; i < 3**5; i++) {
                let pattern = [];
                let temp = i;
                for (let j = 0; j < 5; j++) {
                    pattern.push(colors[temp % 3]);
                    temp = Math.floor(temp / 3);
                }
                
                // Skip cards where all dots are the same color
                if (pattern.every(color => color === pattern[0])) continue;
                
                // Only add if this pattern is not equivalent to one we already have
                if (!deck.some(existingPattern => arePatternsEquivalent(pattern, existingPattern))) {
                    deck.push(pattern);
                }
            }
        }
        
        function startGame(enableFlicker, enableRotate) {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            
            generateDeck();
            score = 0;
            streak = 0;
            timeRemaining = 100;
            gameActive = true;
            flickerMode = enableFlicker;
            rotateMode = enableRotate;
            inverseMode = false;
            
            // Reset flicker state
            currentHiddenCard = -1;
            currentHiddenDot = -1;
            
            // Clear any existing rotation classes and force immediate reset (no animation)
            const card1 = document.getElementById('card1');
            const card2 = document.getElementById('card2');
            card1.classList.remove('rotating-reverse');
            card2.classList.remove('rotating');
            card1.style.transition = 'none';
            card2.style.transition = 'none';
            card1.style.transform = 'rotate(0deg)';
            card2.style.transform = 'rotate(0deg)';
            // Force reflow to apply immediate transform
            card1.offsetHeight;
            card2.offsetHeight;
            // Clear inline styles so CSS can take over
            card1.style.transition = '';
            card2.style.transition = '';
            card1.style.transform = '';
            card2.style.transform = '';
            
            updateScore();
            updateStreak();
            
            // Start timer
            timer = setInterval(() => {
                timeRemaining--;
                document.getElementById('timer').textContent = timeRemaining;
                
                if (timeRemaining <= 0) {
                    endGame();
                }
            }, 1000);
            
            // Draw first pair of cards (this will apply rotation/flicker if needed)
            drawCards();
        }
        
        function startBasicGame() {
            zestyMode = false;
            highestZestyPhase = 'standard';
            currentZestyPhase = 'standard';
            startGame(false, false);
        }
        
        function startZestyGame() {
            zestyMode = true;
            highestZestyPhase = 'standard';
            currentZestyPhase = 'standard';
            awarded10PointBonus = false;
            startGame(false, false);
        }
        
        function getZestyPhaseForScore(currentScore) {
            if (currentScore < 5) return 'standard';
            if (currentScore < 10) return 'rotate';
            if (currentScore < 15) return 'flicker';
            if (currentScore < 20) return 'inverse';
            return 'random';
        }
        
        function getRandomZestyPhase() {
            const phases = ['standard', 'rotate', 'flicker', 'inverse'];
            return phases[Math.floor(Math.random() * phases.length)];
        }
        
        function getPhaseOrder(phase) {
            const order = { 'standard': 0, 'rotate': 1, 'flicker': 2, 'inverse': 3, 'random': 4 };
            return order[phase] || 0;
        }
        
        function applyZestyPhase(phase) {
            const card1 = document.getElementById('card1');
            const card2 = document.getElementById('card2');
            
            // Clear existing modes
            if (flickerInterval) {
                clearInterval(flickerInterval);
                flickerInterval = null;
            }
            card1.classList.remove('rotating-reverse');
            card2.classList.remove('rotating');
            flickerMode = false;
            rotateMode = false;
            
            // Apply new mode (just set flags - rotation/flicker will be applied when cards are drawn)
            if (phase === 'rotate') {
                rotateMode = true;
            } else if (phase === 'flicker') {
                flickerMode = true;
                // Flicker will be started when cards are drawn
            }
            // 'standard' and 'inverse' don't need special setup here
            // inverse is handled separately
        }
        
        function transitionToInverseInZesty() {
            // Stop regular game timers/intervals but keep state
            if (flickerInterval) {
                clearInterval(flickerInterval);
                flickerInterval = null;
            }
            
            // Hide regular game container, show inverse container
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('inverse-container').style.display = 'block';
            
            // Set up inverse mode with shared state
            inverseMode = true;
            inverseScore = score;
            inverseStreak = streak;
            inverseTimeRemaining = timeRemaining;
            
            // Clear the regular timer, start inverse timer
            clearInterval(timer);
            
            updateInverseScore();
            updateInverseStreak();
            
            inverseTimer = setInterval(() => {
                inverseTimeRemaining--;
                timeRemaining = inverseTimeRemaining; // Keep in sync
                document.getElementById('inverse-timer').textContent = inverseTimeRemaining;
                
                if (inverseTimeRemaining <= 0) {
                    endInverseGame();
                }
            }, 1000);
            
            drawInversePuzzle();
        }
        
        function transitionFromInverseToRegular() {
            // Stop inverse timer
            if (inverseTimer) {
                clearInterval(inverseTimer);
                inverseTimer = null;
            }
            
            // Sync state back
            score = inverseScore;
            streak = inverseStreak;
            timeRemaining = inverseTimeRemaining;
            
            // Hide inverse container, show regular game container
            document.getElementById('inverse-container').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            
            inverseMode = false;
            
            // Update displays
            updateScore();
            updateStreak();
            document.getElementById('timer').textContent = timeRemaining;
            
            // Restart regular timer
            timer = setInterval(() => {
                timeRemaining--;
                document.getElementById('timer').textContent = timeRemaining;
                
                if (timeRemaining <= 0) {
                    endGame();
                }
            }, 1000);
            
            // Apply the appropriate phase (use highestZestyPhase since we don't go backward)
            if (highestZestyPhase === 'random') {
                applyZestyPhase(getRandomZestyPhase());
            } else {
                applyZestyPhase(highestZestyPhase);
            }
            
            // Draw new cards
            drawCards();
        }
        
        function flickerDots() {
            if (!gameActive) return;
            
            const card1Element = document.getElementById('card1');
            const card2Element = document.getElementById('card2');
            const dots1 = card1Element.querySelectorAll('.dot-star');
            const dots2 = card2Element.querySelectorAll('.dot-star');
            
            // Helper to set dot color
            function setDotColor(dot, color) {
                // For fruit, redraw the whole element
                dot.innerHTML = '';
                if (color !== 'black') {
                    const rotation = parseFloat(dot.querySelector('svg')?.style.transform.replace(/[^0-9.-]/g, '')) || 0;
                    dot.appendChild(createFruitElement(color, rotation));
                }
            }
            
            // Restore previously hidden dot
            if (currentHiddenCard === 0 && currentHiddenDot >= 0 && dots1[currentHiddenDot]) {
                const dotEl = dots1[currentHiddenDot];
                const angle = (currentHiddenDot * 72) - 90;
                dotEl.innerHTML = '';
                dotEl.appendChild(createFruitElement(currentCards[0][currentHiddenDot], angle + 90));
            } else if (currentHiddenCard === 1 && currentHiddenDot >= 0 && dots2[currentHiddenDot]) {
                const dotEl = dots2[currentHiddenDot];
                const angle = (currentHiddenDot * 72) - 90;
                dotEl.innerHTML = '';
                dotEl.appendChild(createFruitElement(currentCards[1][currentHiddenDot], angle + 90));
            }
            
            // Pick a new random dot (0-9, where 0-4 is card1, 5-9 is card2)
            // Make sure it's not the same as the currently hidden one
            let newHiddenIndex;
            const currentIndex = currentHiddenCard >= 0 ? currentHiddenCard * 5 + currentHiddenDot : -1;
            do {
                newHiddenIndex = Math.floor(Math.random() * 10);
            } while (newHiddenIndex === currentIndex);
            
            const newCard = newHiddenIndex < 5 ? 0 : 1;
            const newDot = newHiddenIndex < 5 ? newHiddenIndex : newHiddenIndex - 5;
            
            // Hide the new dot
            if (newCard === 0 && dots1[newDot]) {
                dots1[newDot].innerHTML = '';
            } else if (dots2[newDot]) {
                dots2[newDot].innerHTML = '';
            }
            
            // Update tracking variables
            currentHiddenCard = newCard;
            currentHiddenDot = newDot;
        }
        
        function startExplorer() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('explorer-container').style.display = 'block';
            
            // Initialize explorer cards (all red)
            explorerCards = [
                ['red', 'red', 'red', 'red', 'red'],
                ['red', 'red', 'red', 'red', 'red']
            ];
            
            // Display explorer cards
            displayExplorerCard('explorer-card1', explorerCards[0], 0);
            displayExplorerCard('explorer-card2', explorerCards[1], 1);
        }
        
        function drawCards() {
            // Choose 2 random cards from the deck
            const index1 = Math.floor(Math.random() * deck.length);
            let index2 = Math.floor(Math.random() * deck.length);
            // Ensure we don't get the same card twice
            while (index2 === index1) {
                index2 = Math.floor(Math.random() * deck.length);
            }
            
            currentCards = [deck[index1], deck[index2]];
            // Apply random rotation to the patterns
            const rotation = Math.floor(Math.random() * 5);
            currentCards[0] = [...currentCards[0].slice(rotation), ...currentCards[0].slice(0, rotation)];
            const rotation2 = Math.floor(Math.random() * 5);
            currentCards[1] = [...currentCards[1].slice(rotation2), ...currentCards[1].slice(0, rotation2)];
            
            // Set up flicker state BEFORE displaying cards (so displayCard can hide the dot)
            if (flickerMode) {
                // Pick a random dot to hide (0-9, where 0-4 is card1, 5-9 is card2)
                const hiddenIndex = Math.floor(Math.random() * 10);
                currentHiddenCard = Math.floor(hiddenIndex / 5);
                currentHiddenDot = hiddenIndex % 5;
            } else {
                currentHiddenCard = -1;
                currentHiddenDot = -1;
            }
            
            // Reset card rotation (only if not in rotate mode)
            const card1 = document.getElementById('card1');
            const card2 = document.getElementById('card2');
            if (!rotateMode) {
                // Remove rotation classes and force immediate position reset
                card1.classList.remove('rotating-reverse');
                card2.classList.remove('rotating');
                card1.style.transition = 'none';
                card2.style.transition = 'none';
                card1.style.transform = 'rotate(0deg)';
                card2.style.transform = 'rotate(0deg)';
                // Force reflow
                card1.offsetHeight;
                card2.offsetHeight;
                // Restore transition for future use
                card1.style.transition = '';
                card2.style.transition = '';
            } else {
                // Reset any inline styles that might interfere with animation
                card1.style.transition = '';
                card2.style.transition = '';
                card1.style.transform = '';
                card2.style.transform = '';
                card1.classList.add('rotating-reverse');
                card2.classList.add('rotating');
            }
            
            // Display cards
            displayCard('card1', currentCards[0], 0);
            displayCard('card2', currentCards[1], 1);
            
            // Clear previous result
            document.getElementById('result').textContent = '';

            // Ensure Hit/Miss buttons are enabled
            document.querySelector('.hit-button').disabled = false;
            document.querySelector('.miss-button').disabled = false;
            
            // Start flicker interval if in flicker mode (dot is already hidden during displayCard)
            if (flickerMode && !flickerInterval) {
                flickerInterval = setInterval(flickerDots, 2000);
            }
        }
        
        function displayCard(elementId, pattern, cardIndex) {
            const cardElement = document.getElementById(elementId);
            cardElement.innerHTML = '';
            
            // Calculate positions for 5 dots in a ring
            for (let i = 0; i < 5; i++) {
                // Position the dot around the circle
                const angle = (i * 72) - 90; // Start from the top (-90 degrees) and go clockwise
                const radian = angle * Math.PI / 180;
                const x = 75 + 50 * Math.cos(radian);
                const y = 75 + 50 * Math.sin(radian);
                
                // Check if this dot should be hidden (flicker mode)
                const shouldHide = flickerMode && currentHiddenCard === cardIndex && currentHiddenDot === i;
                
                const dot = document.createElement('div');
                dot.className = 'dot-star';
                const shapeRotation = angle + 90;
                if (!shouldHide) {
                    dot.appendChild(createFruitElement(pattern[i], shapeRotation));
                }
                dot.style.left = `${x - 15}px`;
                dot.style.top = `${y - 15}px`;
                cardElement.appendChild(dot);
            }
        }
        
        function displayExplorerCard(elementId, pattern, cardIndex) {
            const cardElement = document.getElementById(elementId);
            cardElement.innerHTML = '';
            
            // Calculate positions for 5 dots in a ring
            for (let i = 0; i < 5; i++) {
                // Position the dot around the circle
                const angle = (i * 72) - 90; // Start from the top (-90 degrees) and go clockwise
                const radian = angle * Math.PI / 180;
                const x = 75 + 50 * Math.cos(radian);
                const y = 75 + 50 * Math.sin(radian);
                
                const dot = document.createElement('div');
                dot.className = 'dot-star clickable';
                const shapeRotation = angle + 90;
                dot.appendChild(createFruitElement(pattern[i], shapeRotation));
                dot.style.left = `${x - 15}px`;
                dot.style.top = `${y - 15}px`;
                dot.style.cursor = 'pointer';
                
                // Store index for click handler
                const dotIndex = i;
                dot.addEventListener('click', function() {
                    cycleColor(cardIndex, dotIndex);
                });
                
                cardElement.appendChild(dot);
            }
        }
        
        function cycleColor(cardIndex, dotIndex) {
            const currentColor = explorerCards[cardIndex][dotIndex];
            let newColor;
            
            // Cycle through colors: red -> yellow -> blue -> red
            if (currentColor === 'red') {
                newColor = 'yellow';
            } else if (currentColor === 'yellow') {
                newColor = 'blue';
            } else {
                newColor = 'red';
            }
            
            explorerCards[cardIndex][dotIndex] = newColor;
            
            // Update display
            displayExplorerCard(cardIndex === 0 ? 'explorer-card1' : 'explorer-card2', explorerCards[cardIndex], cardIndex);
        }
        
        function checkExplorerPair() {

        function nextExplorerPair() {

        function exitExplorer() {

            document.getElementById('start-screen').style.display = 'flex';

        function makeCall(call) {
            if (!gameActive) return;
            
            const analysis = analyzeCards(currentCards[0], currentCards[1]);
            const correctAnswer = analysis.isHit ? 'hit' : 'miss';
            const isCorrect = call === correctAnswer;
            
            if (isCorrect) {

                document.querySelector('.hit-button').disabled = true;
                document.querySelector('.miss-button').disabled = true;

                    setTimeout(() => {

                            document.body.removeChild(bonusElement);
                        }
                    }, 2000);
                } else if (is10PointBonus) {
                    // 10-point bonus only: 60 seconds

                    document.getElementById('timer').textContent = timeRemaining;
                    playBonusSound();
                    awarded10PointBonus = true;
                    
                    const timerElement = document.getElementById('timer');
                    const bonusElement = document.createElement('div');
                    bonusElement.className = 'time-bonus';
                    bonusElement.textContent = '+60s';
                    bonusElement.style.left = `${timerElement.offsetLeft + timerElement.offsetWidth/2}px`;
                    bonusElement.style.top = `${timerElement.offsetTop}px`;
                    document.body.appendChild(bonusElement);
                    
                    setTimeout(() => {
                        if (bonusElement.parentNode) {
                            document.body.removeChild(bonusElement);
                        }
                    }, 2000);
                } else {
                    // Play regular correct sound for non-bonus correct answers
                    const correctSound = document.getElementById('correctSound');
                    correctSound.currentTime = 0;
                    correctSound.volume = 0.10;
                    correctSound.play();
                    setTimeout(() => {
                        fadeOut(correctSound, 1000);
                    }, 500);
                }
                
                // Update score display
                updateScore();
                updateStreak();
                
                // Check for Zesty mode transitions (one-way progression only)
                if (zestyMode) {
                    const scorePhase = getZestyPhaseForScore(score);
                    
                    // Only advance if the score-based phase is higher than current highest
                    if (getPhaseOrder(scorePhase) > getPhaseOrder(highestZestyPhase)) {
                        highestZestyPhase = scorePhase;
                        currentZestyPhase = scorePhase;
                        
                        // Check if we need to transition to inverse
                        if (scorePhase === 'inverse') {
                            setTimeout(() => transitionToInverseInZesty(), 1000);
                            return;
                        }
                        
                        // Apply the new phase
                        if (scorePhase === 'random') {
                            applyZestyPhase(getRandomZestyPhase());
                        } else {
                            applyZestyPhase(scorePhase);
                        }
                    } else if (highestZestyPhase === 'random') {
                        // In random phase, pick new random mode for next round
                        applyZestyPhase(getRandomZestyPhase());
                    }
                }
                
                // Draw new cards after a short delay
                setTimeout(drawCards, 1000);
            } else {
                // Disable Hit/Miss buttons
                document.querySelector('.hit-button').disabled = true;
                document.querySelector('.miss-button').disabled = true;

                    } else if (currentHiddenCard === 1 && currentHiddenDot >= 0 && dots2[currentHiddenDot]) {
                        setDotColor(dots2[currentHiddenDot], currentCards[1][currentHiddenDot], currentHiddenDot, 1);
                    }
                    // Pause flicker during explanation
                    if (flickerInterval) {
                        clearInterval(flickerInterval);
                        flickerInterval = null;
                    }
                }

                
                // Show explanation
                const sharedPatternSize = analysis.matches.length;
                document.getElementById('result').innerHTML = 
                    `This pair is ${correctAnswer === 'hit' ? 'sweet' : 'tart'}.<br>` +
                    `Max size of shared pattern: ${sharedPatternSize}`;
                document.getElementById('result').style.color = "#f44336";
                
                // Rotate cards to optimal alignment with shortest path
                const card1 = document.getElementById('card1');
                const card2 = document.getElementById('card2');
                const rotationDegrees = analysis.optimalRotation * -72;
                
                if (rotateMode) {
                    // Get current rotation angles before stopping animation
                    const currentRotation1 = getCurrentRotation(card1);
                    const currentRotation2 = getCurrentRotation(card2);
                    
                    // Find nearest 72° snap position for card1
                    const snapAngle = Math.round(currentRotation1 / 72) * 72;
                    
                    // Remove animation classes
                    card1.classList.remove('rotating-reverse');
                    card2.classList.remove('rotating');
                    
                    // Immediately set current rotation (no transition yet)
                    card1.style.transition = 'none';
                    card2.style.transition = 'none';
                    card1.style.transform = `rotate(${currentRotation1}deg)`;
                    card2.style.transform = `rotate(${currentRotation2}deg)`;
                    
                    // Force reflow to apply the immediate transform
                    card1.offsetHeight;
                    card2.offsetHeight;
                    
                    // Re-enable transition and animate to final position
                    // card2's target is adjusted by card1's snap angle to maintain relative alignment
                    card1.style.transition = 'transform 1s ease';
                    card2.style.transition = 'transform 1s ease';
                    card1.style.transform = `rotate(${snapAngle}deg)`;
                    card2.style.transform = `rotate(${rotationDegrees + snapAngle}deg)`;
                } else {
                    // Non-rotate mode: just animate card2 as before
                    card2.style.transform = `rotate(${rotationDegrees}deg)`;
                }
                
                // Add highlight bubbles after rotation animation
                setTimeout(() => {
                    // Create blob highlights for both cards
                    const indices1 = analysis.matches.map(m => m.index1);
                    const indices2 = analysis.matches.map(m => m.index2);
                    const blob1 = createHighlightBlob(indices1);
                    const blob2 = createHighlightBlob(indices2);
                    document.getElementById('card1').appendChild(blob1);
                    document.getElementById('card2').appendChild(blob2);
                    
                    // Show the Next button
                    document.getElementById('next-button').style.display = 'inline-block';
                }, 1000);
            }
            
            updateScore();
            updateStreak();
        }
        
        function nextPair() {
            // Remove highlight groups if they exist
            const groups = document.querySelectorAll('.highlight-group');
            groups.forEach(group => group.remove());
            
            // Hide the Next button
            document.getElementById('next-button').style.display = 'none';
            
            // In Zesty random phase, pick a new random mode for next round
            if (zestyMode && highestZestyPhase === 'random') {
                applyZestyPhase(getRandomZestyPhase());
            }
            
            // Restart flicker if in flicker mode
            if (flickerMode && !flickerInterval) {
                flickerInterval = setInterval(flickerDots, 2000);
            }
            
            // Draw new cards
            drawCards();
        }
        
        function analyzeCards(card1, card2) {
            let maxMatchingDots = 0;
            let bestRotation = 0;
            let bestMatches = [];
            
            // Try each rotation of card2, keeping track of which gives max matches
            for (let rotation = 0; rotation < 5; rotation++) {
                let matchCount = 0;
                let currentMatches = [];
                
                for (let i = 0; i < 5; i++) {
                    if (card1[i] === card2[(i + rotation) % 5]) {
                        matchCount++;
                        currentMatches.push({
                            index1: i,
                            index2: (i + rotation) % 5
                        });
                    } 
                }
                
                // If we found more matches, or same matches with smaller rotation
                if (matchCount > maxMatchingDots || 
                    (matchCount === maxMatchingDots && 
                     Math.min(rotation, 5 - rotation) < Math.min(bestRotation, 5 - bestRotation))) {
                    maxMatchingDots = matchCount;
                    bestRotation = rotation;
                    bestMatches = currentMatches;
                }
            }
            
            // Convert to smallest rotation (-2 to +2)
            if (bestRotation > 2) {
                bestRotation = bestRotation - 5;
            }
            
            return {
                isHit: maxMatchingDots === 3,
                matchingDots: maxMatchingDots,
                optimalRotation: bestRotation,
                matches: bestMatches
            };
        }
        
        function updateScore() {
            document.getElementById('score').textContent = score;
        }
        
        function updateStreak() {
            // Update streak dots
            for (let i = 1; i <= 5; i++) {
                const dot = document.getElementById(`streak-${i}`);
                if (i <= streak) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            }
        }
        
        function endGame() {
            clearInterval(timer);
            if (flickerInterval) {
                clearInterval(flickerInterval);
                flickerInterval = null;
            }
            gameActive = false;
           // Show game over modal
            document.getElementById('final-score').textContent = score;
            document.getElementById('gameOverModal').style.display = 'block';
           playGameOverSound();
	    }
        
        function resetGame() {
            document.getElementById('next-button').style.display = 'none';
            document.getElementById('gameOverModal').style.display = 'none';
            
            // Stop any existing timers/intervals
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
            if (inverseTimer) {
                clearInterval(inverseTimer);
                inverseTimer = null;
            }
            if (flickerInterval) {
                clearInterval(flickerInterval);
                flickerInterval = null;
            }
            
            // Clear rotation classes and styles from cards before restarting
            const card1 = document.getElementById('card1');
            const card2 = document.getElementById('card2');
            if (card1) {
                card1.classList.remove('rotating-reverse');
                card1.style.transform = '';
                card1.style.transition = '';
            }
            if (card2) {
                card2.classList.remove('rotating');
                card2.style.transform = '';
                card2.style.transition = '';
            }
            
            // Hide both game containers first
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('inverse-container').style.display = 'none';
            
            // Restart based on game type
            if (zestyMode) {
                startZestyGame();
            } else {
                startBasicGame();
            }
        }
        
        function returnToMainMenu() {
            // Stop all timers
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
            if (inverseTimer) {
                clearInterval(inverseTimer);
                inverseTimer = null;
            }
            if (flickerInterval) {
                clearInterval(flickerInterval);
                flickerInterval = null;
            }
            
            // Reset all mode flags
            zestyMode = false;
            flickerMode = false;
            rotateMode = false;
            inverseMode = false;
            gameActive = false;
            highestZestyPhase = 'standard';
            currentZestyPhase = 'standard';
            
            // Remove rotation classes from cards
            const card1 = document.getElementById('card1');
            const card2 = document.getElementById('card2');
            if (card1) {
                card1.classList.remove('rotating-reverse');
                card1.style.transform = '';
                card1.style.transition = '';
            }
            if (card2) {
                card2.classList.remove('rotating');
                card2.style.transform = '';
                card2.style.transition = '';
            }
            
            // Hide all containers, show start screen
            document.getElementById('gameOverModal').style.display = 'none';
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('inverse-container').style.display = 'none';
            document.getElementById('explorer-container').style.display = 'none';
            document.getElementById('start-screen').style.display = 'flex';
        }
        
        // ============ INVERSE MODE FUNCTIONS ============
        
        function startInverseMode() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('inverse-container').style.display = 'block';
            
            generateDeck();
            inverseMode = true;
            flickerMode = false;
            rotateMode = false;
            inverseScore = 0;
            inverseStreak = 0;
            inverseTimeRemaining = 100;
            gameActive = true;
            
            updateInverseScore();
            updateInverseStreak();
            
            // Start timer
            inverseTimer = setInterval(() => {
                inverseTimeRemaining--;
                document.getElementById('inverse-timer').textContent = inverseTimeRemaining;
                
                if (inverseTimeRemaining <= 0) {
                    endInverseGame();
                }
            }, 1000);
            
            // Draw first puzzle
            drawInversePuzzle();
        }
        
        function getOtherColors(color) {
            return colors.filter(c => c !== color);
        }
        
        function getParity(card1, card2) {
            const analysis = analyzeCards(card1, card2);
            return analysis.isHit ? 'hit' : 'miss';
        }
        
        function drawInversePuzzle() {
            // Choose a random card x
            const xIndex = Math.floor(Math.random() * deck.length);
            let x = [...deck[xIndex]];
            
            // Apply random rotation
            const rotation = Math.floor(Math.random() * 5);
            x = [...x.slice(rotation), ...x.slice(0, rotation)];
            
            // Choose a random dot to be the mystery dot
            const dIndex = Math.floor(Math.random() * 5);
            const correctColor = x[dIndex];
            
            // Store the correct answer
            inverseCorrectColor = correctColor;
            inverseMysteryDotIndex = dIndex;
            
            // Create the two other possible cards (v and w)
            const otherColors = getOtherColors(correctColor);
            const v = [...x];
            v[dIndex] = otherColors[0];
            const w = [...x];
            w[dIndex] = otherColors[1];
            
            // Store the mystery card (with the original color for now, we'll display it differently)
            inverseMysteryCard = [...x];
            
            // Initialize guess to gray (no color selected yet)
            inverseCurrentGuess = 'gray';
            
            // Generate reference cards using the greedy algorithm
            inverseRefCards = [];
            inverseParities = [];
            
            let y1, y1Parity, vY1Parity, wY1Parity;
            let attempts = 0;
            const maxAttempts = 100;
            
            // Draw y1 until it provides information
            while (attempts < maxAttempts) {
                attempts++;
                const y1Index = Math.floor(Math.random() * deck.length);
                y1 = [...deck[y1Index]];
                // Apply random rotation to y1
                const y1Rotation = Math.floor(Math.random() * 5);
                y1 = [...y1.slice(y1Rotation), ...y1.slice(0, y1Rotation)];
                
                y1Parity = getParity(x, y1);
                vY1Parity = getParity(v, y1);
                wY1Parity = getParity(w, y1);
                
                // If all three have same parity, y1 provides no info - redraw
                if (y1Parity === vY1Parity && y1Parity === wY1Parity) {
                    continue;
                }
                
                // y1 provides some info, break
                break;
            }
            
            // Check if y1 alone determines the answer
            if (y1Parity !== vY1Parity && y1Parity !== wY1Parity) {
                // y1 alone determines the answer (k=1)
                inverseRefCards = [y1];
                inverseParities = [y1Parity];
            } else {
                // Need y2 to disambiguate
                // Determine which of v,w has same parity as x with y1
                // (x, y1) has same parity as exactly one of (v, y1), (w, y1)
                const sameAsV = (y1Parity === vY1Parity);
                
                // Draw y2 until it disambiguates
                let y2;
                attempts = 0;
                while (attempts < maxAttempts) {
                    attempts++;
                    const y2Index = Math.floor(Math.random() * deck.length);
                    y2 = [...deck[y2Index]];
                    // Apply random rotation to y2
                    const y2Rotation = Math.floor(Math.random() * 5);
                    y2 = [...y2.slice(y2Rotation), ...y2.slice(0, y2Rotation)];
                    
                    const xY2Parity = getParity(x, y2);
                    const vY2Parity = getParity(v, y2);
                    const wY2Parity = getParity(w, y2);
                    
                    // If y2 alone determines the answer, use y2 as y1 with k=1
                    if (xY2Parity !== vY2Parity && xY2Parity !== wY2Parity) {
                        inverseRefCards = [y2];
                        inverseParities = [xY2Parity];
                        break;
                    }
                    
                    // Check if y2 helps disambiguate given y1
                    if (sameAsV) {
                        // We need to distinguish x from v (since x and v have same parity with y1)
                        // y2 helps if (x, y2) and (v, y2) have different parity
                        if (xY2Parity !== vY2Parity) {
                            inverseRefCards = [y1, y2];
                            inverseParities = [y1Parity, xY2Parity];
                            break;
                        }
                    } else {
                        // We need to distinguish x from w (since x and w have same parity with y1)
                        // y2 helps if (x, y2) and (w, y2) have different parity
                        if (xY2Parity !== wY2Parity) {
                            inverseRefCards = [y1, y2];
                            inverseParities = [y1Parity, xY2Parity];
                            break;
                        }
                    }
                    // y2 doesn't help, redraw
                }
            }
            
            // Randomize the order of reference cards when k=2
            if (inverseRefCards.length === 2 && Math.random() < 0.5) {
                inverseRefCards = [inverseRefCards[1], inverseRefCards[0]];
                inverseParities = [inverseParities[1], inverseParities[0]];
            }
            
            // Debug logging
            
            // Verify: check that the correct color gives the shown parities
            const testCard = [...inverseMysteryCard];
            inverseRefCards.forEach((ref, i) => {
                const parity = getParity(testCard, ref);
            });
            
            // Display the puzzle
            displayInversePuzzle();
            
            // Clear previous result
            document.getElementById('inverse-result').textContent = '';
            document.getElementById('inverse-next-button').style.display = 'none';
            // Submit button starts disabled until a color is selected
            document.getElementById('inverse-submit-button').disabled = true;
        }
        
        function displayInversePuzzle() {
            // Display mystery card with the mystery dot clickable
            displayInverseMysteryCard();
            
            // Display reference cards
            displayCard('inverse-ref-card1', inverseRefCards[0]);
            document.getElementById('inverse-parity1').textContent = inverseParities[0].toUpperCase();
            document.getElementById('inverse-parity1').className = 
                'parity-text ' + (inverseParities[0] === 'hit' ? 'parity-hit' : 'parity-miss');
            
            // Show/hide second reference card and parity
            if (inverseRefCards.length > 1) {
                document.getElementById('inverse-ref-card2').style.display = 'inline-block';
                document.getElementById('inverse-parity2').style.display = 'block';
                displayCard('inverse-ref-card2', inverseRefCards[1]);
                document.getElementById('inverse-parity2').textContent = inverseParities[1].toUpperCase();
                document.getElementById('inverse-parity2').className = 
                    'parity-text ' + (inverseParities[1] === 'hit' ? 'parity-hit' : 'parity-miss');
            } else {
                document.getElementById('inverse-ref-card2').style.display = 'none';
                document.getElementById('inverse-parity2').style.display = 'none';
            }
        }
        
        function displayInverseMysteryCard() {
            const cardElement = document.getElementById('inverse-mystery-card');
            cardElement.innerHTML = '';
            
            for (let i = 0; i < 5; i++) {
                // Position the dot
                const angle = (i * 72) - 90;
                const radian = angle * Math.PI / 180;
                const xPos = 75 + 50 * Math.cos(radian);
                const yPos = 75 + 50 * Math.sin(radian);
                
                const isMystery = (i === inverseMysteryDotIndex);
                const color = isMystery ? inverseCurrentGuess : inverseMysteryCard[i];
                
                const dot = document.createElement('div');
                dot.className = 'dot-star' + (isMystery ? ' mystery-dot' : '');
                const shapeRotation = angle + 90;
                dot.appendChild(createFruitElement(color, shapeRotation));
                dot.style.left = `${xPos - 15}px`;
                dot.style.top = `${yPos - 15}px`;
                
                if (isMystery) {
                    dot.style.cursor = 'pointer';
                    dot.addEventListener('click', cycleInverseGuess);
                }
                
                cardElement.appendChild(dot);
            }
        }
        
        function cycleInverseGuess() {
            // If gray, start with red; otherwise cycle through colors
            if (inverseCurrentGuess === 'gray') {
                inverseCurrentGuess = colors[0]; // red
                // Enable submit button now that a color is selected
                document.getElementById('inverse-submit-button').disabled = false;
            } else {
                const currentIndex = colors.indexOf(inverseCurrentGuess);
                inverseCurrentGuess = colors[(currentIndex + 1) % colors.length];
            }
            displayInverseMysteryCard();
        }
        
        function submitInverseAnswer() {
            if (!gameActive) return;
            
            // Debug logging
            
            // Double-check: verify the guess against references
            const guessCard = [...inverseMysteryCard];
            guessCard[inverseMysteryDotIndex] = inverseCurrentGuess;
            inverseRefCards.forEach((ref, i) => {
                const parity = getParity(guessCard, ref);
            });
            
            const isCorrect = inverseCurrentGuess === inverseCorrectColor;
            
            document.getElementById('inverse-submit-button').disabled = true;
            
            if (isCorrect) {
                inverseScore += 1;
                inverseStreak += 1;
                
                // Sync with main score in Zesty mode
                if (zestyMode) {
                    score = inverseScore;
                    timeRemaining = inverseTimeRemaining;
                }
                
                document.getElementById('inverse-result').textContent = "Correct!";
                document.getElementById('inverse-result').style.color = "#4CAF50";
                
                // Check for streak bonus
                if (inverseStreak === 5) {
                    inverseTimeRemaining += 15;
                    if (zestyMode) timeRemaining = inverseTimeRemaining;
                    document.getElementById('inverse-timer').textContent = inverseTimeRemaining;
                    playBonusSound();
                    inverseStreak = 0;
                } else {
                    const correctSound = document.getElementById('correctSound');
                    correctSound.currentTime = 0;
                    correctSound.volume = 0.10;
                    correctSound.play();
                    setTimeout(() => {
                        fadeOut(correctSound, 1000);
                    }, 500);
                }
                
                // Check for Zesty mode transitions (one-way progression)
                if (zestyMode) {
                    const scorePhase = getZestyPhaseForScore(score);
                    
                    // Only advance if the score-based phase is higher than current highest
                    if (getPhaseOrder(scorePhase) > getPhaseOrder(highestZestyPhase)) {
                        highestZestyPhase = scorePhase;
                        currentZestyPhase = scorePhase;
                        
                        // If we reach random phase (score >= 20), might transition out of inverse
                        if (scorePhase === 'random') {
                            const randomPhase = getRandomZestyPhase();
                            if (randomPhase !== 'inverse') {
                                setTimeout(() => transitionFromInverseToRegular(), 1000);
                                return;
                            }
                        }
                    } else if (highestZestyPhase === 'random') {
                        // Already in random phase, might switch out of inverse
                        const randomPhase = getRandomZestyPhase();
                        if (randomPhase !== 'inverse') {
                            setTimeout(() => transitionFromInverseToRegular(), 1000);
                            return;
                        }
                    }
                }
                
                // Draw new puzzle after a short delay
                setTimeout(drawInversePuzzle, 1000);
            } else {
                inverseScore = Math.max(0, inverseScore - 2);
                inverseStreak = 0;
                
                // Sync with main score in Zesty mode
                if (zestyMode) {
                    score = inverseScore;
                    streak = inverseStreak;
                }
                
                const incorrectSound = document.getElementById('incorrectSound');
                incorrectSound.currentTime = 0;
                incorrectSound.volume = 0.55;
                incorrectSound.play();
                
                // Show the correct answer
                inverseCurrentGuess = inverseCorrectColor;
                displayInverseMysteryCard();
                
                document.getElementById('inverse-result').textContent = 
                    `Incorrect! The mystery fruit was ${inverseCorrectColor}.`;
                document.getElementById('inverse-result').style.color = "#f44336";
                
                // Show next button
                document.getElementById('inverse-next-button').style.display = 'inline-block';
            }
            
            updateInverseScore();
            updateInverseStreak();
        }
        
        function nextInversePair() {
            document.getElementById('inverse-next-button').style.display = 'none';
            
            // In Zesty random phase, might switch out of inverse on next round
            if (zestyMode && highestZestyPhase === 'random') {
                const randomPhase = getRandomZestyPhase();
                if (randomPhase !== 'inverse') {
                    transitionFromInverseToRegular();
                    return;
                }
            }
            
            drawInversePuzzle();
        }
        
        function updateInverseScore() {
            document.getElementById('inverse-score').textContent = inverseScore;
        }
        
        function updateInverseStreak() {
            for (let i = 1; i <= 5; i++) {
                const dot = document.getElementById(`inverse-streak-${i}`);
                if (i <= inverseStreak) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            }
        }
        
        function endInverseGame() {
            clearInterval(inverseTimer);
            gameActive = false;
            
            // Use appropriate score for game over display
            const finalScore = zestyMode ? score : inverseScore;
            document.getElementById('final-score').textContent = finalScore;
            document.getElementById('gameOverModal').style.display = 'block';
            playGameOverSound();
        }
        
        // Initialize the game
        generateDeck();
    </script>
